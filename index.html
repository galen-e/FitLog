<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#14201d;--mut:#66746f;--ac:#0f766e;--acx:#fff;--bd:#dde4e1;--dn:#c2410c;--chip:#e0f2ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--card:#17211e;--tx:#e8efec;--mut:#8fa09a;--ac:#2dd4bf;--acx:#06201c;--bd:#26332f;--dn:#fb923c;--chip:#1d3b36;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1513;--card:#17211e;--tx:#e8efec;--mut:#8fa09a;--ac:#2dd4bf;--acx:#06201c;--bd:#26332f;--dn:#fb923c;--chip:#1d3b36;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 10px}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--chip);color:var(--tx);cursor:pointer;min-width:0}
button.pri{background:var(--ac);color:var(--acx);font-weight:600;width:100%;padding:13px}
.row[data-user]>button.pri{width:auto}
button.link{background:none;color:var(--mut);padding:6px;display:inline-flex;align-items:center;justify-content:center;min-width:0}
button.del{background:none;color:var(--dn);padding:4px 8px;display:inline-flex;align-items:center;justify-content:center;min-width:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:0 0 auto}
.action-row{display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}.action-row>*{flex:0 0 auto}
.icon-btn{width:38px;height:38px;padding:0;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--tx);display:inline-flex;align-items:center;justify-content:center}
.icon-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.is-liked{color:#ef4444;background:#ffe4e6;border-color:#fecdd3}
.icon-btn.is-liked svg{fill:currentColor;stroke:currentColor}
.feed-badge{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--bd);background:var(--chip);color:var(--tx);font-size:12px;font-weight:600;min-width:0}
.feed-badge svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.post-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.post-badges{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.comment-modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.65);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:40}
.comment-modal{width:min(100%,480px);max-height:80vh;background:var(--card);border:1px solid var(--bd);border-radius:18px 18px 0 0;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.comment-modal-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--bd)}
.comment-list{max-height:280px;overflow:auto;padding:12px 14px 6px}
.comment-item{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin-bottom:8px}
.comment-item-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.comment-actions{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.comment-form{padding:12px 14px 14px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.comment-form textarea{width:100%;resize:vertical;min-height:80px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.workout-menu{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:12px}
.workout-menu button{padding:7px 4px;white-space:nowrap;font-size:13px}
.profile-header{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.profile-avatar{width:88px;height:88px;flex:0 0 88px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--chip);color:var(--ac);font-size:30px;font-weight:700}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-avatar-fallback{line-height:1}
.chip{background:var(--chip);border-radius:20px;padding:3px 10px;font-size:13px}
.mut{color:var(--mut);font-size:14px}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:6px;align-items:center;margin:4px 0}
.sets input{padding:8px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mut);font-size:13px;padding:8px;display:flex;align-items:center;justify-content:center;height:42px}
nav button.on{color:var(--ac);font-weight:700}
.nav-icon{width:21px;height:21px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.ov .card{width:100%;max-width:380px;margin:0}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
.err{color:var(--dn);min-height:20px;font-size:14px}
svg text{fill:var(--mut);font-size:10px}
.up{color:var(--ac);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--mut);margin:8px 0 4px}
.day{padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--bg);border:1px solid var(--bd);min-height:52px;position:relative;font-size:14px;border-radius:8px;color:var(--tx)}
.day span{font-size:9px;color:var(--mut)}.day.wk{background:var(--chip)}.day.today{border:2px solid var(--ac)}.day.sel{outline:2px solid var(--tx)}
.day i{position:absolute;top:1px;right:3px;font-size:10px;color:var(--ac);font-style:normal}
button.chip{border:1px solid var(--bd);background:var(--card);padding:4px 10px;font-size:13px}
button.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.masked-password{-webkit-text-security:disc}
ul.tips{margin:6px 0 0;padding-left:20px}ul.tips li{margin:4px 0}
</style></head>
<body><main id="app"></main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jsArg=s=>JSON.stringify(String(s??'')).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const supabaseConfig=window.FITLOG_SUPABASE_CONFIG||{};
const supabaseReady=!!(window.supabase?.createClient&&/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(supabaseConfig.url||'')&&supabaseConfig.anonKey&&!supabaseConfig.anonKey.includes('YOUR_'));
const supabaseClient=supabaseReady?window.supabase.createClient(supabaseConfig.url,supabaseConfig.anonKey):null;
let S={users:{},session:null},authUser=null,authMessage='',isHydrating=false,syncSaveTimer=null,syncChannel=null,syncRefreshTimer=null;
try{localStorage.removeItem('fitlog1')}catch(e){}
function showSyncError(error){console.error(error);toast('Could not sync. Check your connection and try again.')}
async function hydrateRemoteState(){
  if(!supabaseClient||!authUser)throw new Error('Backend is not connected.');
  isHydrating=true;
  try{
  const uid=authUser.id;
  const [profilesResult,dataResult,followsResult,postsResult,likesResult,commentsResult]=await Promise.all([
    supabaseClient.from('profiles').select('id,username,display_name,bio,avatar_url,unit'),
    supabaseClient.from('user_data').select('data').eq('user_id',uid).maybeSingle(),
    supabaseClient.from('follows').select('follower_id,followed_id'),
    supabaseClient.from('posts').select('id,author_id,caption,workout,media,created_at').order('created_at',{ascending:false}),
    supabaseClient.from('post_likes').select('post_id,user_id'),
    supabaseClient.from('post_comments').select('id,post_id,user_id,text,created_at').order('created_at',{ascending:true})
  ]);
  for(const result of [profilesResult,dataResult,followsResult,postsResult,likesResult,commentsResult])if(result.error)throw result.error;
  const usersById=new Map();
  const users={};
  for(const row of profilesResult.data||[]){
    const data=row.id===uid?(dataResult.data?.data||{}):{};
    const user={
      authId:row.id,unit:data.unit||row.unit||'lb',workouts:Array.isArray(data.workouts)?data.workouts:[],weights:Array.isArray(data.weights)?data.weights:[],
      custom:Array.isArray(data.custom)?data.custom:[],draft:data.draft||null,sched:data.sched||{},friends:[],followers:[],posts:[],
      profile:{displayName:row.display_name||row.username,bio:row.bio||'',avatar:row.avatar_url||''}
    };
    users[row.username]=user;usersById.set(row.id,row.username);
  }
  for(const relation of followsResult.data||[]){
    const follower=usersById.get(relation.follower_id),followed=usersById.get(relation.followed_id);
    if(follower&&followed){users[follower].friends.push(followed);users[followed].followers.push(follower)}
  }
  const likesByPost=new Map(),commentsByPost=new Map();
  for(const like of likesResult.data||[]){const name=usersById.get(like.user_id);if(name){if(!likesByPost.has(like.post_id))likesByPost.set(like.post_id,[]);likesByPost.get(like.post_id).push(name)}}
  for(const comment of commentsResult.data||[]){
    const name=usersById.get(comment.user_id);if(name){if(!commentsByPost.has(comment.post_id))commentsByPost.set(comment.post_id,[]);commentsByPost.get(comment.post_id).push({id:comment.id,author:name,text:comment.text,createdAt:new Date(comment.created_at).getTime()})}
  }
  for(const post of postsResult.data||[]){
    const author=usersById.get(post.author_id);
    if(author)users[author].posts.push({id:post.id,author,createdAt:new Date(post.created_at).getTime(),caption:post.caption,media:post.media||[],likes:likesByPost.get(post.id)||[],comments:commentsByPost.get(post.id)||[],workout:post.workout});
  }
  const username=usersById.get(uid);
  if(!username)throw new Error('Your FitLog profile is missing. Re-run supabase-schema.sql and sign up again.');
  S={users,session:username};
  }finally{isHydrating=false}
}
async function persistRemoteUserData(){
  if(!supabaseClient||!authUser||!S.session||isHydrating)return;
  const user=U();
  const {error:dataError}=await supabaseClient.from('user_data').upsert({user_id:authUser.id,data:{unit:user.unit,workouts:user.workouts,weights:user.weights,custom:user.custom,draft:user.draft,sched:user.sched||{}}});
  if(dataError)throw dataError;
  const {error:profileError}=await supabaseClient.from('profiles').update({display_name:user.profile.displayName||S.session,bio:user.profile.bio||'',avatar_url:user.profile.avatar||'',unit:user.unit}).eq('id',authUser.id);
  if(profileError)throw profileError;
}
function save(){
  if(!supabaseClient||!authUser||!S.session||isHydrating)return;
  clearTimeout(syncSaveTimer);
  syncSaveTimer=setTimeout(()=>persistRemoteUserData().catch(showSyncError),400);
}
async function flushRemoteUserData(){clearTimeout(syncSaveTimer);await persistRemoteUserData()}
function subscribeToRemoteChanges(){
  if(!supabaseClient||!authUser)return;
  if(syncChannel)supabaseClient.removeChannel(syncChannel);
  syncChannel=supabaseClient.channel(`fitlog-${authUser.id}`)
    .on('postgres_changes',{event:'*',schema:'public',table:'profiles'},scheduleRemoteRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'follows'},scheduleRemoteRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'posts'},scheduleRemoteRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'post_likes'},scheduleRemoteRefresh)
    .on('postgres_changes',{event:'*',schema:'public',table:'post_comments'},scheduleRemoteRefresh)
    .subscribe();
}
function scheduleRemoteRefresh(){
  clearTimeout(syncRefreshTimer);
  syncRefreshTimer=setTimeout(()=>hydrateRemoteState().then(render).catch(showSyncError),350);
}
const PRESET={Chest:['Bench Press','Incline Dumbbell Press','Push-Up','Chest Fly'],Back:['Deadlift','Pull-Up','Barbell Row','Lat Pulldown'],Legs:['Squat','Leg Press','Lunge','Romanian Deadlift','Calf Raise'],Glutes:['Hip Thrust'],Shoulders:['Overhead Press','Lateral Raise','Face Pull'],Biceps:['Barbell Curl','Hammer Curl'],Triceps:['Triceps Pushdown','Dips','Skull Crusher'],Core:['Plank','Crunch','Hanging Leg Raise'],Cardio:['Running','Cycling','Rowing']};
let tab='w',workoutPanel='workout',mode='in',asked=false,sel=null,arm=null,calM=0,selK=null,pd=null,editing=false;
let commentPanel={open:false,postAuthor:null,postId:null,editingCommentId:null,draft:''};
const ensureUserShape=u=>{
  if(!u)return u;
  u.friends=Array.isArray(u.friends)?u.friends:[];
  u.followers=Array.isArray(u.followers)?u.followers:[];
  u.posts=Array.isArray(u.posts)?u.posts:[];
  u.profile=u.profile||{displayName:'',bio:''};
  return u;
};
const U=()=>{const u=S.users[S.session];return ensureUserShape(u);};
const DAY=864e5;
async function auth(){
  const username=($('#un')?.value||'').trim().toLowerCase(),email=$('#email').value.trim().toLowerCase(),password=$('#pw').value,er=$('#err');
  if(!supabaseClient){er.textContent='Connect a Supabase project in supabase-config.js to create an account or log in.';return}
  if(password.length<8){er.textContent='Password needs at least 8 characters.';return}
  if(mode==='up'&&!/^[a-z0-9_]{3,24}$/.test(username)){er.textContent='Username must be 3-24 characters: lowercase letters, numbers, or underscores.';return}
  if(!email.includes('@')){er.textContent='Enter a valid email address.';return}
  er.textContent='';
  let result;
  try{
    result=mode==='up'
      ?await supabaseClient.auth.signUp({email,password,options:{data:{username,unit:$('#unit').value}}})
      :await supabaseClient.auth.signInWithPassword({email,password});
  }catch(error){er.textContent=error.message||'Could not reach the backend.';return}
  if(result.error){er.textContent=result.error.message.includes('profiles_username_key')?'That username is already taken.':result.error.message;return}
  authUser=result.data.user;
  if(!result.data.session){authMessage='Check your email to confirm the account, then log in.';er.textContent=authMessage;return}
  try{
    await hydrateRemoteState();subscribeToRemoteChanges();tab='w';workoutPanel='workout';asked=true;authMessage='';render();
  }catch(error){er.textContent=error.message||'Could not load your account.';authUser=null;await supabaseClient.auth.signOut()}
}
async function logout(){
  try{await flushRemoteUserData();if(syncChannel)await supabaseClient.removeChannel(syncChannel);if(supabaseClient)await supabaseClient.auth.signOut()}
  catch(error){showSyncError(error)}
  syncChannel=null;authUser=null;S={users:{},session:null};render();
}
function D(){const u=U();if(!u.draft)u.draft={name:'',acc:0,t0:null,ex:[]};return u.draft}
const secs=d=>d.acc+(d.t0?Math.floor((Date.now()-d.t0)/1000):0);
const fmt=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const dstr=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
function toast(t){const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2200)}
function tog(){const d=D();if(d.t0){d.acc=secs(d);d.t0=null}else d.t0=Date.now();save();render()}
setInterval(()=>{const e=$('#tm');if(e&&S.session&&tab==='w')e.textContent=fmt(secs(D()))},1000);
function cat(){const m={};for(const g in PRESET)m[g]=[...PRESET[g]];for(const c of U().custom)(m[c.group]=m[c.group]||[]).push(c.name);return m}
const newSet=()=>({reps:'',weight:''});
function addEx(){const v=$('#exsel').value;if(!v)return;const i=v.indexOf('|');D().ex.push({name:v.slice(i+1),group:v.slice(0,i),sets:[newSet()]});save();render()}
function addCustom(){const n=$('#cn').value.trim(),g=$('#cg').value;if(!n)return;const u=U();if(!u.custom.some(c=>c.name.toLowerCase()===n.toLowerCase()))u.custom.push({name:n,group:g});D().ex.push({name:n,group:g,sets:[newSet()]});save();render()}
function sv(i,j,k,v){D().ex[i].sets[j][k]=v;save()}
function addSet(i){const s=D().ex[i].sets,l=s[s.length-1];s.push({reps:l.reps,weight:l.weight});save();render()}
function rmSet(i,j){const e=D().ex[i];e.sets.splice(j,1);if(!e.sets.length)D().ex.splice(i,1);save();render()}
function rmEx(i){D().ex.splice(i,1);save();render()}
function finish(){
  const d=D(),ex=d.ex.map(e=>({...e,sets:e.sets.filter(s=>+s.reps>0||+s.weight>0)})).filter(e=>e.sets.length);
  if(!ex.length){toast('Add at least one set first.');return}
  const u=U();
  const dateValue=Date.now();
  const baseName=stripWorkoutDateSuffix(d.name.trim()||'Workout');
  const finalName=buildWorkoutName(baseName, dateValue);
  const key=normalizeWorkoutName(baseName);
  const workout={id:Date.now(),date:dateValue,name:finalName,dur:secs(d),groups:[...new Set(ex.map(e=>e.group))],ex};
  const existingIndex=u.workouts.findIndex(w=>normalizeWorkoutName(stripWorkoutDateSuffix(w.name))===key);
  if(existingIndex>=0){
    u.workouts.splice(existingIndex,1,workout);
  }else{
    u.workouts.unshift(workout);
  }
  u.draft=null;save();tab='w';workoutPanel='history';toast('Workout saved');render();
}
function discard(){U().draft=null;save();render()}
function normalizeWorkoutName(name){return String(name||'').trim().toLowerCase().replace(/\s+/g,' ')}
function stripWorkoutDateSuffix(name){
  const text=String(name||'').trim();
  const match=text.match(/^(.*?)(?:\s*[-–—]\s*[A-Za-z]{3,9}\s+\d{1,2},\s+\d{4})$/);
  return match?match[1].trim():text;
}
function buildWorkoutName(rawName, dateValue=Date.now()){
  const base=String(rawName||'').trim() || 'Workout';
  const dateLabel=new Date(dateValue).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
  return `${base} - ${dateLabel}`;
}
function delW(id){if(arm!==id){arm=id;render();return}const u=U();u.workouts=u.workouts.filter(w=>w.id!==id);arm=null;save();render()}
async function followUser(target){
  if(!target||target===S.session)return;
  const targetUser=S.users[target];
  if(!targetUser||U().friends.includes(target))return;
  const {error}=await supabaseClient.from('follows').insert({follower_id:authUser.id,followed_id:targetUser.authId});
  if(error&&error.code!=='23505'){showSyncError(error);return}
  await hydrateRemoteState();render();
}
async function unfollowUser(target){
  if(!target||target===S.session)return;
  const targetUser=S.users[target];
  if(!targetUser)return;
  const {error}=await supabaseClient.from('follows').delete().eq('follower_id',authUser.id).eq('followed_id',targetUser.authId);
  if(error){showSyncError(error);return}
  await hydrateRemoteState();render();
}
async function readMediaFiles(fileInput){
  const files=fileInput&&fileInput.files?Array.from(fileInput.files):[];
  if(!files.length)return [];
  const media=[];
  for(const file of files){
    if(file.size>10*1024*1024)throw new Error(`${file.name} is larger than 10 MB.`);
    const path=`${authUser.id}/${crypto.randomUUID()}-${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
    const {error}=await supabaseClient.storage.from('fitlog-media').upload(path,file,{cacheControl:'3600',upsert:false,contentType:file.type});
    if(error)throw error;
    const {data}=supabaseClient.storage.from('fitlog-media').getPublicUrl(path);
    media.push({name:file.name,type:file.type,size:file.size,path,data:data.publicUrl});
  }
  return media;
}
async function shareSelectedWorkout(){
  const select=$('#postWorkoutSelect');
  const note=$('#postCaption');
  const mediaInput=$('#postMediaInput');
  if(!select||!note)return;
  const workoutId=Number(select.value);
  const workout=U().workouts.find(w=>w.id===workoutId);
  if(!workout){toast('Pick a saved workout first.');return}
  const caption=note.value.trim();
  try{
    const media=mediaInput?await readMediaFiles(mediaInput):[];

function chart(p){
  if(p.length<2)return '<p class="mut">Log at least two entries to see a trend.</p>';
  const W=340,H=180,L=38,R=12,T=12,B=26;
  let lo=Math.min(...p.map(x=>x.v)),hi=Math.max(...p.map(x=>x.v));
  if(lo===hi){lo-=1;hi+=1}const pd=(hi-lo)*.15;lo-=pd;hi+=pd;
  const X=i=>L+i*(W-L-R)/(p.length-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo),r=v=>Math.round(v*10)/10;
  let g='';for(const v of [hi,(hi+lo)/2,lo])g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end">${r(v)}</text>`;
  const pts=p.map((x,i)=>X(i).toFixed(1)+','+Y(x.v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img">${g}<polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2.5" stroke-linejoin="round"/>${p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3.5" fill="var(--ac)"/>`).join('')}<text x="${L}" y="${H-8}">${dstr(p[0].d)}</text><text x="${W-R}" y="${H-8}" text-anchor="end">${dstr(p[p.length-1].d)}</text></svg>`;
}
function delta(p,unit){if(p.length<2)return '';const d=Math.round((p[p.length-1].v-p[0].v)*10)/10;return `<p class="mut">Change since first entry: <span class="up">${d>0?'+':''}${d} ${unit}</span></p>`}
function weekly(w){const m={};for(const x of w)m[Math.floor(x.date/(7*DAY))]={d:x.date,v:x.v};return Object.keys(m).sort((a,b)=>a-b).map(k=>m[k])}

async function updateProfileAvatar(input){
  const file=input.files&&input.files[0];
  if(!file)return;
  if(!file.type.startsWith('image/')){toast('Choose an image file.');input.value='';return}
  if(file.size>8*1024*1024){toast('Choose an image smaller than 8 MB.');input.value='';return}
  try{
    const imageUrl=URL.createObjectURL(file);
    const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=imageUrl});
    URL.revokeObjectURL(imageUrl);
    const scale=Math.min(320/Math.max(image.width,image.height),1);
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));
    canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.82));
    if(!blob)throw new Error('Could not resize that image.');
    const path=`${authUser.id}/avatar-${crypto.randomUUID()}.jpg`;
    const {error:uploadError}=await supabaseClient.storage.from('fitlog-media').upload(path,blob,{cacheControl:'3600',upsert:false,contentType:'image/jpeg'});
    if(uploadError)throw uploadError;
    const {data}=supabaseClient.storage.from('fitlog-media').getPublicUrl(path);
    U().profile.avatar=data.publicUrl;
    await persistRemoteUserData();
    render();
  }catch(error){showSyncError(error);toast(error.message||'Could not upload profile photo.')}
}

    const commentItems=comments.length?comments.map(c=>`<div class="comment-item"><div class="comment-item-top"><strong>${esc(c.author)}</strong>${c.author===S.session?`<span class="comment-actions"><button class="link" onclick="beginEditComment(${jsArg(commentPanel.postAuthor)}, ${jsArg(post.id)}, ${jsArg(c.id)})">Edit</button><button class="del" onclick="deleteComment(${jsArg(commentPanel.postAuthor)}, ${jsArg(post.id)}, ${jsArg(c.id)})">Delete</button></span>`:''}</div><div class="mut">${esc(c.text)}</div></div>`).join(''):'<p class="mut" style="margin:0">No comments yet.</p>';
    return `<div class="comment-modal-backdrop" onclick="closeCommentPanel()"><div class="comment-modal" onclick="event.stopPropagation()"><div class="comment-modal-header"><h2 style="margin:0">Comments</h2><button class="link" onclick="closeCommentPanel()">Close</button></div><div class="comment-list">${commentItems}</div><div class="comment-form"><textarea placeholder="Write a comment..." oninput="commentPanel.draft=this.value">${esc(commentPanel.draft)}</textarea><button class="pri" onclick="submitCommentPanel()">${commentPanel.editingCommentId?'Save comment':'Post comment'}</button></div></div></div>`;
  })():'';

  return `<div class="card"><h2>Feed</h2>${feedHtml}</div>${modalHtml}`;
}
const DN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TIPS=['Sleep 7–9 hours. Most muscle repair happens while you sleep.','Eat enough protein across the day and enough carbs to refill your energy stores.','Drink plenty of water, especially if you sweat a lot when training.','Take a light walk or do easy stretching and mobility work to keep blood flowing.','Foam roll or gently massage tight, sore areas.','A warm shower or bath can help muscles relax.','Mild soreness is normal, but sharp or joint pain isn’t. Rest it, and see a professional if it lingers.','Keep stress low. Rest days work best when they’re genuinely restful.'];
const sch=()=>U().sched||(U().sched={});
const lab=i=>{const s=sch()[i];return s?(s.name||(s.groups||[]).join(' + ')):''};
const kd=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function plab(i){const s=pd[i];return s.name||s.groups.join(' + ')}
function updLb(i){const e=$('#lb'+i);if(e)e.textContent='· '+(plab(i)||'Rest')}
function editSplit(){pd={};for(let i=0;i<7;i++){const s=sch()[i]||{};pd[i]={name:s.name||'',groups:[...(s.groups||[])]}}editing=true;render()}
function tgG(i,g,el){const s=pd[i],k=s.groups.indexOf(g);k<0?s.groups.push(g):s.groups.splice(k,1);el.classList.toggle('on');updLb(i)}
function setN(i,v){pd[i].name=v.trim();updLb(i)}
function saveSplit(){U().sched=pd;pd=null;editing=false;save();toast('Split saved');render()}
function cancelSplit(){pd=null;editing=false;render()}
function begin(){const d=D(),l=lab(new Date().getDay());if(!d.name)d.name=l;if(!d.t0&&!d.acc)d.t0=Date.now();tab='w';workoutPanel='workout';save();render()}
const going=()=>{const d=D();return d.t0||d.acc||d.ex.length};
function beginBtn(l){return `<button class="pri" onclick="begin()">${going()?'Continue':'Begin'} ${esc(l)}</button>`}
function tipList(n,start){return `<ul class="tips">${Array.from({length:n},(_,k)=>`<li>${TIPS[(start+k)%TIPS.length]}</li>`).join('')}</ul>`}
function todayCard(){
  const now=new Date(),l=lab(now.getDay());
  if(!Object.keys(sch()).some(i=>lab(i)))return `<div class="card"><h2>Plan your week</h2><p class="mut" style="margin:0 0 8px">Set your weekly split to get a one-tap start button here.</p><button onclick="workoutPanel='plan';render()">Open Plan →</button></div>`;
  if(l)return `<div class="card"><div class="mut">Today’s plan</div><h2>${esc(l)}</h2>${beginBtn(l)}</div>`;
  return `<div class="card"><h2>Today: Rest day</h2><p class="mut" style="margin:0">${TIPS[now.getDate()%TIPS.length]}</p><button class="link" onclick="workoutPanel='plan';render()">More recovery tips →</button></div>`;
}
function vPlan(){
  const u=U(),now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+calM,1),first=m.getDay(),dim=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
  const done={};u.workouts.forEach(w=>{done[kd(new Date(w.date))]=1});
  if(!selK)selK=kd(now);
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=dim;d++){
    const dt=new Date(m.getFullYear(),m.getMonth(),d),k=kd(dt),l=lab(dt.getDay()),s=sch()[dt.getDay()];
    const ab=l?(s.groups.length?s.groups.map(g=>g.slice(0,3)).join('·'):l.slice(0,6)):'Rest';
    cells+=`<button class="day${k===kd(now)?' today':''}${k===selK?' sel':''}${l?' wk':''}" onclick="selK='${k}';render()"><b>${d}</b><span>${esc(ab)}</span>${done[k]?'<i>✓</i>':''}</button>`;
  }
  const [y,mo,da]=selK.split('-').map(Number),sd=new Date(y,mo-1,da),sl=lab(sd.getDay()),isT=selK===kd(now);
  const ws=u.workouts.filter(w=>kd(new Date(w.date))===selK);
  const det=`<div class="card"><h2>${sd.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2>
  ${ws.map(w=>`<div style="margin-bottom:6px"><b>✓ ${esc(w.name)}</b> <span class="mut">· ${fmt(w.dur)}</span>${chips(w.groups)}</div>`).join('')}
  ${sl?`<p style="margin:0 0 8px"><span class="mut">Planned:</span> <b>${esc(sl)}</b></p>${isT?beginBtn(sl):''}`:`<p style="margin:0"><b>Rest day</b> <span class="mut">· recovery tips</span></p>${tipList(3,da)}`}</div>`;
  if(editing&&pd){
    const ed=[1,2,3,4,5,6,0].map(i=>{const s=pd[i];return `<div style="margin:12px 0"><b>${DN[i]}</b> <span class="mut" id="lb${i}">· ${esc(plab(i)||'Rest')}</span><div class="chips">${Object.keys(PRESET).map(g=>`<button class="chip${s.groups.includes(g)?' on':''}" onclick="tgG(${i},'${g}',this)">${g}</button>`).join('')}</div><input style="margin-top:8px" placeholder="Custom name (optional)" value="${esc(s.name)}" oninput="setN(${i},this.value)"></div>`}).join('');
    return `<div class="card"><h2>Weekly split</h2><p class="mut" style="margin:0">Pick muscle groups for each training day. Leave a day empty for a rest day. Nothing is saved until you tap Save.</p>${ed}<button class="pri" onclick="saveSplit()">Save split</button><button class="link" style="width:100%;margin-top:6px" onclick="cancelSplit()">Cancel</button></div>`;
  }
  const none=!Object.keys(sch()).some(i=>lab(i));
  const sum=[1,2,3,4,5,6,0].map(i=>`<div class="row" style="margin:4px 0"><span>${DN[i]}</span><span class="mut" style="text-align:right">${esc(lab(i)||'Rest')}</span></div>`).join('');
  return `<div class="card"><div class="row"><button onclick="calM--;render()">‹</button><h2 style="margin:0;text-align:center">${m.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button onclick="calM++;render()">›</button></div>
  <div class="dow">${'SMTWTFS'.split('').map(c=>`<span>${c}</span>`).join('')}</div><div class="cal">${cells}</div></div>${det}
  <div class="card"><h2>Weekly split</h2>${sum}<button onclick="editSplit()" style="margin-top:8px;width:100%">${none?'Set up weekly split':'Edit split'}</button></div>`;
}
function vAuth(){
  return `<header><h1>FitLog</h1></header><div class="card"><h2>${mode==='in'?'Log in':'Create account'}</h2>
  ${mode==='up'?'<input id="un" name="fitlog-username" placeholder="Username (3-24 letters, numbers, underscores)" autocapitalize="none" autocomplete="username" aria-label="Username" style="margin-bottom:8px">':''}
  <input id="email" name="fitlog-email" type="email" placeholder="Email address" autocomplete="email" aria-label="Email address" style="margin-bottom:8px">
  <input id="pw" name="fitlog-password" type="password" placeholder="Password (8+ characters)" autocomplete="${mode==='in'?'current-password':'new-password'}" aria-label="Password" style="margin-bottom:8px">
  ${mode==='up'?'<select id="unit" style="margin-bottom:8px"><option value="lb">Pounds (lb)</option><option value="kg">Kilograms (kg)</option></select>':''}
  <div class="err" id="err">${esc(authMessage||(!supabaseReady?'Configure Supabase in supabase-config.js to enable accounts.':''))}</div><button class="pri" onclick="auth()">${mode==='in'?'Log in':'Sign up'}</button>
  <button class="link" style="width:100%;margin-top:6px" onclick="mode=\'${mode==='in'?'up':'in'}\';render()">${mode==='in'?'New here? Create an account':'Have an account? Log in'}</button></div>
  <p class="mut">Workouts are private to your account. Profiles and posts are shared with signed-in FitLog users.</p>`;
}
function render(){
  const a=$('#app');
  if(!S.session||!U()){a.innerHTML=vAuth();return}
  const v=tab==='w'?vWorkout():tab==='p'?vProfile():tab==='f'?vFriends():tab==='s'?vFeed():vWorkout();
  const totalLikes=Object.values(S.users).reduce((sum,user)=>sum+(Array.isArray(user.posts)?user.posts.reduce((count,post)=>count+(Array.isArray(post.likes)?post.likes.length:0),0):0),0);
  const ov=(!asked&&due())?`<div class="ov"><div class="card"><h2>Weekly weigh-in</h2><p class="mut">Log your body weight so we can track your progress.</p><input id="bw" type="number" inputmode="decimal" placeholder="Weight (${U().unit})" style="margin-bottom:10px"><button class="pri" onclick="addW()">Save</button><button class="link" style="width:100%" onclick="skipW()">Skip for now</button></div></div>`:'';
  const navTabs=[
    ['w','Workout','<path d="M3 8h3v8H3zM6 6h3v12H6zM9 11h6v2H9zM15 6h3v12h-3zM18 8h3v8h-3z" fill="currentColor" stroke="none"/>'],
    ['p','Profile','<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'],
    ['f','Friends','<path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>'],
    ['s','Feed','<path d="M4 5h16v15H4zM8 9h3v3H8zM14 9h3M14 12h3M8 16h9"/>'],
  ];
  a.innerHTML=`<header><h1>FitLog</h1><div class="mut"><span>${esc(S.session)}</span> <span class="chip">${totalLikes} likes</span> <button class="link" onclick="logout()">Log out</button></div></header>${v}${ov}<nav>${navTabs.map(([key,label,icon])=>`<button type="button" class="${tab===key?'on':''}" onclick="tab='${key}';render()" aria-label="${label}" title="${label}"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">${icon}</svg></button>`).join('')}</nav>`;
}
async function startApp(){
  if(!supabaseClient){render();return}
  const {data,error}=await supabaseClient.auth.getSession();
  if(error){authMessage=error.message;render();return}
  if(data.session){
    authUser=data.session.user;
    try{await hydrateRemoteState();subscribeToRemoteChanges();asked=true}
    catch(loadError){authMessage=loadError.message||'Could not load your account.';authUser=null}
  }
  render();
}
startApp().catch(error=>{authMessage=error.message||'Could not connect to FitLog.';render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
